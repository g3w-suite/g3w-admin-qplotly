[build-system]
requires = ["setuptools>=67", "setuptools_scm[toml]>=7.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g3w-admin-qplotly"
dynamic = ["version"]
description = "DataPlotly integration for G3W-ADMIN"
readme = "README.md"
license = { text = "Mozilla Public License 2.0 (MPL 2.0)" }
dependencies = ["plotly==5.20.0"]

[tool.setuptools.packages.find]
include = ["qplotly*"]
exclude = ["qplotly.tests", "qplotly.tests.*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"qplotly.vendor.DataPlotly.core.plot_types" = ["icons/*.svg"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
